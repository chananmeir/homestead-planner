[pytest]
testpaths = tests

# Markers must be registered or pytest warns on every use.
markers =
    external: requires a live third-party service or an API key that is not
        available in a clean checkout (e.g. GEOCODING_API_KEY). Excluded in CI
        with `-m "not external"`; run them locally when you have credentials.

# Keep the default output readable; individual runs can override.
addopts = --strict-markers
